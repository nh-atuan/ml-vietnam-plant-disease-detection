project_name: "vietnam-plant-disease-detection"
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  img_size: 224
  batch_size: 32
  train_split: 0.8

models:
  baseline: "simple_cnn"
  intermediate: "custom_cnn"
  advanced: "resnet18"
  save_dir: "models/best_model"

training:
  epochs: 20
  learning_rate: 0.001
  device: "cpu"  # Change to "cuda" if GPU available
