# Training Defaults — Cấu hình huấn luyện chung cho tất cả mô hình
# Phụ trách: Nguyễn Hồ Anh Tuấn (Phase 3, Task 3.3)
# Mỗi model config sẽ kế thừa defaults này và override nếu cần.

data:
  img_size: 224
  batch_size: 32
  num_workers: 4
  pin_memory: true
  train_split: "data/splits/train.csv"
  val_split: "data/splits/val.csv"
  test_split: "data/splits/test.csv"

training:
  epochs: 50
  optimizer: "adamw"
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: "cosine_annealing"  # hoặc "reduce_on_plateau"
  scheduler_params:
    T_max: 50  # cho cosine
    # patience: 5  # cho reduce_on_plateau
  early_stopping:
    monitor: "val_macro_f1"
    patience: 7
    mode: "max"
    min_delta: 0.001
  amp: true  # mixed precision
  gradient_clip: 1.0

checkpoint:
  save_dir: "experiments/{model_name}/checkpoints"
  monitor: "val_macro_f1"
  mode: "max"

mlflow:
  tracking_uri: "mlruns"
  experiment_name: "plant-disease-detection"

augmentation:
  # Levels: weak / medium / strong
  level: "medium"
  mixup_alpha: 0.4
  cutmix_alpha: 1.0

