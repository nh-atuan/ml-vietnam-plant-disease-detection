# ResNet50 — Baseline mạnh
# Phụ trách: Đàm Tiến Đạt (Phase 3, Task 3.5)

model:
  name: "resnet50"
  pretrained: true
  num_classes: 8
  freeze_backbone: true
  unfreeze_after_epoch: 3

training:
  learning_rate: 1.0e-4
  batch_size: 32
  epochs: 50
  weight_decay: 1.0e-4

