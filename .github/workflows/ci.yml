name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      SKIP_DB_INIT: "true"
      # Remote K3s/DuckDNS checks require deployment credentials and must not
      # make the reproducible API integration suite depend on live infra.
      SKIP_REMOTE_TESTS: "true"
      PYTHONPATH: "."
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv sync --frozen --only-group backend --only-group dev

      - name: Lint
        run: |
          uv run ruff check scripts/export_onnx.py scripts/export_openapi.py src/segmentation tests backend/app/db backend/app/knowledge backend/app/routers backend/app/main.py backend/app/models/schemas.py

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Test
        run: |
          uv run pytest -q tests

      - name: Verify OpenAPI Spec is Up-to-Date
        run: |
          uv run python scripts/export_openapi.py
          git diff --exit-code docs/api/openapi.json || (echo "Lỗi: File docs/api/openapi.json chưa đồng bộ với code mới nhất! Hãy chạy scripts/export_openapi.py và commit lại." && exit 1)

