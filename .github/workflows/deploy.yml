name: CI/CD - Build, Push & Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  NAMESPACE: plant-disease
  HELM_RELEASE: plant-disease
  DOMAIN: plant-disease-demo.duckdns.org

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.0"

      - name: Install dependencies
        run: uv sync --only-group backend --only-group dev

      - name: Run Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run pytest tests/ -v --tb=short

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/plant-backend
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/plant-frontend

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/plant-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/plant-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/plant-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/plant-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://${{ env.DOMAIN }}/api/v1

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_VM_SSH_KEY }}" | tr -d '\r' > ~/.ssh/gcp_key
          chmod 600 ~/.ssh/gcp_key
          cat >> ~/.ssh/config <<EOF
          Host gcp-k3s
            HostName ${{ secrets.GCP_VM_HOST }}
            User ${{ secrets.GCP_VM_USER }}
            IdentityFile ~/.ssh/gcp_key
            StrictHostKeyChecking no
          EOF

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Package Helm chart
        run: |
          tar -czf /tmp/plant-disease-helm.tgz -C deployment helm

      - name: Upload Helm chart to VM
        run: |
          scp /tmp/plant-disease-helm.tgz gcp-k3s:/tmp/plant-disease-helm.tgz

      - name: Deploy via SSH
        run: |
          ssh gcp-k3s << 'EOF'
            rm -rf /tmp/plant-disease-deploy
            mkdir -p /tmp/plant-disease-deploy
            tar -xzf /tmp/plant-disease-helm.tgz -C /tmp/plant-disease-deploy
            kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
            kubectl -n ${{ env.NAMESPACE }} create secret docker-registry ghcr-registry-credentials \
              --docker-server=${{ env.REGISTRY }} \
              --docker-username=${{ github.actor }} \
              --docker-password='${{ secrets.GITHUB_TOKEN }}' \
              --dry-run=client -o yaml | kubectl apply -f -
            helm upgrade --install ${{ env.HELM_RELEASE }} /tmp/plant-disease-deploy/helm \
              --namespace ${{ env.NAMESPACE }} \
              --create-namespace \
              --set backend.image.tag=${{ github.sha }} \
              --set frontend.image.tag=${{ github.sha }} \
              --set global.domain=${{ env.DOMAIN }} \
              --set ingress.tlsEmail=${{ secrets.CERT_EMAIL }} \
              --set-string secretsRaw.jwt-secret='${{ secrets.JWT_SECRET_KEY }}' \
              --set-string secretsRaw.postgres-user='${{ secrets.POSTGRES_USER }}' \
              --set-string secretsRaw.postgres-password='${{ secrets.POSTGRES_PASSWORD }}' \
              --set-string secretsRaw.minio-access-key='${{ secrets.MINIO_ACCESS_KEY }}' \
              --set-string secretsRaw.minio-secret-key='${{ secrets.MINIO_SECRET_KEY }}' \
              --wait --timeout 10m
          EOF

      - name: Verify deployment
        run: |
          ssh gcp-k3s "kubectl -n ${{ env.NAMESPACE }} get pods"

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Wait for rollout
        run: sleep 60

      - name: Health check
        run: |
          curl -sf https://${{ env.DOMAIN }}/health || exit 1

      - name: Knowledge API check
        run: |
          curl -sf https://${{ env.DOMAIN }}/api/v1/knowledge || exit 1

      - name: Auth flow check
        run: |
          # Register a test user
          curl -sf -X POST https://${{ env.DOMAIN }}/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"smoke_${{ github.run_id }}","email":"smoke_${{ github.run_id }}@test.com","password":"smoke123456"}' || exit 1

      - name: Predict E2E check
        run: |
          # This requires a sample image - run if available
          echo "Skipping predict E2E - run manually with sample image"
